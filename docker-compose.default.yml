# docker-compose.default.yml

services:

  wp:
    image: pmc-dev-wp
    build:
      context: ./docker/wpdev
    depends_on:
      - memcached
      - mysql
      - traefik
    restart: "unless-stopped"
    labels:
      - traefik.enable=true
      - traefik.http.routers.wp-https.entrypoints=websecure
      - traefik.http.routers.wp-https.priority=1
      # Traefik v3: HostRegexp uses a raw Go regexp (the v2 `{name:pattern}`
      # named-group syntax was removed). `.+` = catch-all fallback host.
      - traefik.http.routers.wp-https.rule=HostRegexp(`.+`)
      # No ACME certresolver exists; serve TLS from the default cert store
      # (docker/traefik/conf/ssl.yml). `tls=true` enables TLS on the router.
      - traefik.http.routers.wp-https.tls=true
      # wp exposes both 80 and 443, so v3 needs an explicit backend port.
      # WordPress serves plain HTTP on 80; Traefik terminates TLS.
      - traefik.http.routers.wp-https.service=wp-https
      - traefik.http.services.wp-https.loadbalancer.server.port=80
    networks:
      default:
        aliases:
          - wp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - docker-compose.env
    environment:
      XDEBUG_REMOTE_HOST: "${XDEBUG_REMOTE_HOST-}"
      SSH_AUTH_SOCK: /ssh/ssh-agent.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - root:/root
      - tmp:/tmp
      - ssh:/ssh
      - ./:/pmc-dev
      - ./wp-root:/var/www/html

  memcached:
    image: memcached
    restart: "unless-stopped"
    labels:
      - "traefik.enable=false"
    networks:
      default:
        aliases:
          - memcached

  mysql:
    # Note: we're using the official mysql image for mysql workbench compatible since it doesn't work with mariadb
    # use docker-composer.override.yml to override prefer to use mariadb image
    image: mysql:8.0-oracle
    command: --default-authentication-plugin=mysql_native_password
    restart: "unless-stopped"
    labels:
      - "traefik.enable=false"
    networks:
      default:
        ipv4_address: 172.30.30.6
        aliases:
          - mysql
          - revtech-net-mysql
    ports:
      - "${PMC_DEV_MYSQL_IP-0.0.0.0}:3306:3306"
    env_file:
      - docker-compose.env
    volumes:
      - ./:/pmc-dev
      - mysql:/var/lib/mysql

  ssh-agent:
    image: pmc-dev-ssh-agent
    build:
      context: ./docker/ssh-agent
    restart: "unless-stopped"
    labels:
      - "traefik.enable=false"
    networks:
      default:
        aliases:
          - ssh-agent
    working_dir: /pmc-dev
    env_file:
      - docker-compose.env
    environment:
      - PMC_CI_ENCODED_KEY="${SSH_ENCODED_KEY-}"
      - SSH_AUTH_SOCK=/ssh/ssh-agent.sock
    secrets:
      - ssh_key
    volumes:
      - root:/root
      - ssh:/ssh
      - tmp:/tmp
      - ./:/pmc-dev
      - ~/.ssh:/root/.ssh

  traefik:
    # v3 negotiates the Docker API version; v2.9 hard-pinned API 1.24, which
    # Docker Engine 29.x (min API 1.40) rejects -> provider could not connect.
    image: traefik:v3.7
    restart: "unless-stopped"
    networks:
      default:
        # We want to reserve this IP for future use
        # ${PMC_DEV_TRAEFIK_IP} can be empty or string format "x.x.x.x"
        ipv4_address: "${PMC_DEV_TRAEFIK_IP-172.30.80.80}"
        aliases:
          - traefik.pmcdev.local
          - traefik
    ports:
      # ${PMC_DEV_BIND_IP} can be empty or string format "x.x.x.x"
      - "${PMC_DEV_BIND_IP-0.0.0.0}:443:443"
      - "${PMC_DEV_BIND_IP-0.0.0.0}:80:80"
    env_file:
      - docker-compose.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/traefik:/etc/traefik

networks:
  # Using a giant single subnet for everything
  # docker for window for some reason doesn't like two network interface on a container
  # windows can't route traffic to the second interface and we have no control on the primary interface assigned
  default:
    name: traefik
    driver: bridge
    ipam:
      driver: default
      config:
      # We need this subnet to be fixed and reserved for all web traffics.  This can be override by docker-compose.override.yml
      # We shouldn't need more than class c address on development environment
      - subnet: 172.30.0.0/16

volumes:
  configstore:
    name: configstore
  consul:
    name: consul
  mysql:
    name: mysql
  rabbitmq:
    name: rabbitmq
  redis:
    name: redis
  root:
    name: root
  ssh:
    name: ssh
  tmp:
    name: tmp

secrets:
  ssh_key:
    file: ~/.ssh/id_rsa
